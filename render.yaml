databases:
  - name: polla-db
    plan: free
    databaseName: polla_futbolera
    user: polla

services:
  - type: web
    name: polla-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: polla-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://polla-futbolera-wofa.onrender.com
      - key: API_FOOTBALL_KEY
        value: replace_me
      - key: API_FOOTBALL_LEAGUE_ID
        value: "1"
      - key: API_FOOTBALL_SEASON
        value: "2026"
      - key: SYNC_CRON
        value: "*/15 * * * *"
      - key: ADMIN_LOGIN
        value: "1000000001"
      - key: ADMIN_PASSWORD
        generateValue: true

  - type: web
    name: polla-futbolera
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://polla-backend-a166.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
